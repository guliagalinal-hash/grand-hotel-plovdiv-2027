<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <!-- Google tag: shared by RU and BG pages; configure GA4 destination in Google tag settings. -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-KSS5FH9M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{desc}}">
  <!-- PREVIEW ONLY: remove the next line (and public/robots.txt "Disallow") at launch — see README → Launch checklist. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#142D39">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" hreflang="ru" href="{{alternateRu}}">
  <link rel="alternate" hreflang="bg" href="{{alternateBg}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{desc}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:locale:alternate" content="{{ogLocaleAlt}}">
  <meta property="og:image" content="{{ogImage}}">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/{{css}}">
</head>
<body>
  <div id="root">{{html}}</div>
  <script defer src="../assets/{{js}}"></script>
</body>
</html>
